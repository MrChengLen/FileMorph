# The browser tests (tests/browser/), run by .github/workflows/browser.yml:
#   python -m pytest -c tests/browser/pytest.ini tests/browser
# This file makes tests/browser/ the rootdir, so pytest does not load
# tests/conftest.py, which needs the dev requirements; the job installs only
# requirements.lock and requirements-browser.lock. The main suite in turn
# leaves this folder out (collect_ignore in tests/conftest.py): it has no
# browsers. docs/development.md says how to run it on your own machine.
[pytest]
addopts = -p no:cacheprovider
