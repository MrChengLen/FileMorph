# SPDX-License-Identifier: AGPL-3.0-or-later
#
# deps-lock — regenerate requirements.lock and requirements-sbom.lock and commit
# them to the current branch.
#
# The lockfile is what the image installs (Dockerfile: `pip install
# --require-hashes -r requirements.lock`), so every requirements.txt change
# needs a matching recompile. `ci.yml`'s `lockfile-drift` job fails when the
# two diverge and uploads the correct lockfile as an artifact; this workflow is
# the one-click alternative so the fix does not depend on someone downloading
# an artifact by hand. requirements-sbom.lock, the lockfile sbom.yml and
# release.yml install the SBOM generator from, follows requirements-sbom.txt
# the same way.
#
# You can also just run it locally — `uv pip compile --python-version` resolves
# for the shipped interpreter without needing it installed:
#
#     uv pip compile --generate-hashes --python-version 3.14 --python-platform x86_64-unknown-linux-gnu --output-file requirements.lock requirements.txt
#     uv pip compile --generate-hashes --python-version 3.14 --python-platform x86_64-unknown-linux-gnu --output-file requirements-sbom.lock requirements-sbom.txt
#
# Why that matters: before these gates existed, Dependabot pushed 32 commits to
# requirements.txt in six months while the lockfile received 4 (one of them only
# line endings). It ended up missing four packages outright and behind on five
# more — which is exactly what happens when keeping a lockfile current is
# manual work nobody is reminded of.
#
# Usage — from the Actions tab, or:
#
#     gh workflow run deps-lock.yml --ref <branch>
#
# GitHub only exposes `workflow_dispatch` for workflows that exist on the
# default branch, so this is available once merged to main; before that, use
# the artifact from `lockfile-drift`.
#
# Note: this commit is made by github-actions[bot] via GITHUB_TOKEN and is
# therefore *unsigned*, unlike the GPG-signed human commits in this repo. It
# also deliberately does not trigger further workflow runs (GitHub suppresses
# events for GITHUB_TOKEN pushes), so re-run CI on the branch afterwards to see
# the gates go green.

name: deps-lock

on:
  workflow_dispatch:

# Needs write access to push the regenerated lockfile back to the branch.
permissions:
  contents: write

concurrency:
  group: deps-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recompile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Any interpreter would do — uv resolves for the target version via
          # --python-version without needing it installed. Kept at the shipped
          # version for consistency across workflows, which
          # scripts/check_python_version.py enforces.
          python-version: "3.14"
          # No `cache: "pip"`: this job can push, and code on main can write
          # that cache — including the uv install below, which is not hashed.

      # The uv requirements-dev.txt pins — see the note in ci.yml's
      # lockfile-drift job.
      - name: Install uv
        run: |
          uv_pin=$(grep -oE '^uv==[0-9][0-9A-Za-z.!+-]*' requirements-dev.txt)
          pip install --only-binary :all: "$uv_pin"

      # Must match ci.yml's commands and the committed headers verbatim.
      - name: Recompile the lockfiles
        run: |
          uv pip compile --generate-hashes --python-version 3.14 --python-platform x86_64-unknown-linux-gnu --output-file requirements.lock requirements.txt
          uv pip compile --generate-hashes --python-version 3.14 --python-platform x86_64-unknown-linux-gnu --output-file requirements-sbom.lock requirements-sbom.txt

      - name: Verify the lockfiles install
        # A lockfile that resolves but cannot install is worse than none, since
        # the failure would surface in the image build instead — or, for the
        # SBOM generator, in the release. Installing into throwaway venvs with
        # --require-hashes reproduces exactly what the Dockerfile and the SBOM
        # workflows do.
        run: |
          python -m venv /tmp/lockcheck
          /tmp/lockcheck/bin/pip install --require-hashes -r requirements.lock
          python -m venv /tmp/sbomcheck
          /tmp/sbomcheck/bin/pip install --require-hashes --only-binary :all: -r requirements-sbom.lock

      # The branch name reaches the script as $GITHUB_REF_NAME, not as `${{ }}`
      # text: git allows `$(`, backticks and `;` in branch names.
      - name: Commit if changed
        run: |
          if git diff --quiet -- requirements.lock requirements-sbom.lock; then
            echo "requirements.lock and requirements-sbom.lock already in sync — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock requirements-sbom.lock
          git commit -m "deps: recompile the lockfiles" \
                     -m "Regenerated by the deps-lock workflow from requirements.txt and requirements-sbom.txt."
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "Pushed. Re-run CI on this branch — a GITHUB_TOKEN push raises no events."
