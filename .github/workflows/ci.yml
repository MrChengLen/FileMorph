name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# A newer push on the same pull request cancels its older queued / running
# runs: saves Actions quota while iterating on a PR. On main every commit gets a
# group of its own, so its post-merge gates always complete and never wait.
# Grouped by ref, a merge's CI queued behind the previous merge's: on 2026-11-04
# the commit that was then deployed waited 3 min, and in 10 of the 100 runs
# before it up to 32 min. notify-ops.yml deploys only main's tip, so runs side
# by side do no harm.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least-privilege default for GITHUB_TOKEN (OpenSSF Scorecard Token-Permissions).
# Both jobs only read the checkout; no job here writes back to the repo.
permissions:
  contents: read

jobs:
  lint-and-test:
    # Pinned like every job except deps-latest.yml's, which keeps ubuntu-latest
    # as the canary (tests/test_workflow_runs.py).
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    # A real PostgreSQL for tests/test_audit_postgres.py. The rest of the suite
    # builds its schema from the models on in-memory SQLite and never runs the
    # migrations. That is how migration 005's append-only trigger on
    # audit_events could refuse the ON DELETE SET NULL cascade of every free
    # account deletion (fixed in migration 012), and migration 001 could fail on
    # an empty database, without a failing test. The major version is the one
    # docker-compose.cloud.yml runs (the test checks it). Pinned by digest
    # like the veraPDF image: to move it, take the digest from
    # `docker buildx imagetools inspect postgres:<tag>`. Trust auth is fine for
    # a throwaway database that only this job's steps can reach.
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: filemorph_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Must match the Dockerfile's base image — the app is only ever
          # tested on the version it ships on. scripts/check_python_version.py
          # gates this; see its docstring for the drift it exists to prevent.
          python-version: "3.14"
          cache: "pip"

      - name: Install system dependencies
        id: system-deps
        run: |
          # The runner image ships an apt source for Google Chrome, which this
          # project does not use. Its index is intermittently inconsistent and
          # then fails `apt-get update` with a hash-sum mismatch (exit 100),
          # taking the whole job down with it — it blocked every PR on
          # 2026-09-09. Dropping the source first makes the update depend only
          # on repositories we actually install from.
          #
          # Matched by name rather than by a fixed filename: the runner images
          # have moved between `google-chrome.list` and the deb822
          # `google-chrome.sources`, and a stale `rm -f` of the wrong one fails
          # silently — which is exactly how the first attempt at this slipped
          # through and left the job failing identically.
          sudo find /etc/apt/sources.list.d -iname '*google*' -delete
          echo "::group::apt-get update"
          sudo apt-get update
          echo "::endgroup::"
          # The WeasyPrint libraries go by the names the Dockerfile's base stage
          # installs. Ubuntu 26.04 (ubuntu-latest since November 2026) dropped
          # the old name libgdk-pixbuf2.0-0; the libgdk-pixbuf-xlib-2.0-0 that
          # apt offers instead is an add-on Debian is removing
          # (bugs.debian.org/976677).
          echo "::group::apt-get install"
          sudo apt-get install -y ffmpeg ghostscript libheif-dev libcairo2 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0
          echo "::endgroup::"

      # Tests run against the versions the image ships. requirements-dev.txt
      # pulls in requirements.txt, whose `>=` ranges resolve to the newest
      # releases: SQLAlchemy 2.1.0 (2026-09-24) reached CI that way and failed a
      # test on every branch, while the image stayed on 2.0.52. The lockfile —
      # what the Dockerfile installs — therefore constrains every runtime
      # package. Dev-only tools (pytest, ruff, uv, aiosqlite, …) are not in it
      # and resolve as before; a dependency they share with the app (packaging,
      # requests, …) stays at its locked version. The unpinned install runs
      # weekly in deps-latest.yml as an early warning.
      #
      # The hashes are stripped because pip switches the whole install to
      # --require-hashes as soon as one constraint carries a hash, and the dev
      # tools are unhashed. The step fails if a lockfile entry did not become a
      # constraint (or none did), instead of letting it install unpinned.
      #
      # A resolver conflict here usually means requirements.txt raised a floor
      # past the locked version, as Dependabot pip PRs do: lockfile-drift is red
      # as well, and recompiling the lockfile fixes both. If lockfile-drift is
      # green, a dev tool wants a different version of a locked package. If it
      # caps one below the pin, hold that dev-tool bump. If it needs a newer
      # one, which a plain recompile does not move, move it explicitly — that
      # changes what ships, so review it like a runtime bump (uv leaves the flag
      # out of the lockfile header, so lockfile-drift stays green):
      #   uv pip compile --generate-hashes --python-version 3.14 --python-platform x86_64-unknown-linux-gnu --upgrade-package <name> --output-file requirements.lock requirements.txt
      - name: Install Python dependencies
        id: deps
        run: |
          constraints="$RUNNER_TEMP/constraints.txt"
          grep -E '^[A-Za-z0-9._-]+==' requirements.lock | cut -d' ' -f1 > "$constraints"
          if [ ! -s "$constraints" ] || grep -E '^[^[:space:]#]' requirements.lock | grep -qvE '^[A-Za-z0-9._-]+=='; then
            echo "::error::Not every requirements.lock entry could be turned into a constraint (see the comment above this step in ci.yml)."
            exit 1
          fi
          pip install -r requirements-dev.txt -c "$constraints"

      # From here on every check runs even when an earlier one failed, so that
      # one red run shows them all: a new advisory used to stop the job at
      # pip-audit and leave the tests unrun (13 times in two weeks of October
      # 2026). The pip-audit and veraPDF steps keep the default condition:
      # tests/test_supply_chain_hygiene.py allows them no `if:`, and the job
      # fails either way. The ids feed the summary at the end.
      - name: Lint (ruff)
        id: lint
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: ruff check .

      - name: Format check (ruff)
        id: format
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: ruff format --check .

      # One Python version across image, CI, and lockfile. A Dependabot base-image
      # bump used to move production to a version CI never tested (2b26b49: 3.12 ->
      # 3.14, undetected for three months). The Dockerfile is the source of truth;
      # this fails if anything disagrees. See the script's docstring.
      - name: Python-version consistency gate
        id: python-version
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python scripts/check_python_version.py

      # Tailwind dynamic-class gate — forbids `class="prefix-{{ x }}-suffix"`
      # patterns that JIT extraction misses, leaving the production bundle
      # silently incomplete. See scripts/check_template_classes.py docstring.
      - name: Template class gate
        id: template-classes
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python scripts/check_template_classes.py

      # Tailwind bundle freshness gate — rebuild the purged bundle from the
      # committed templates/JS and fail if it differs from the committed one.
      # A stale bundle silently drops every utility class added since the last
      # manual rebuild: from May to September 2026 about 46 classes the
      # templates used (grid columns, gaps, list numbering, bottom-0, …) never
      # rendered. The script pins the CLI version and verifies its SHA-256
      # before running it. A deleted old bundle shows up as a tracked change and
      # a new one as untracked, so `status --porcelain` catches either; the
      # status runs on its own line so a git failure aborts instead of passing.
      # On failure the CI-built bundle is uploaded — useful when a local build
      # differs (Tailwind also scans untracked template files, CI never sees them).
      - name: Tailwind bundle freshness gate
        id: tailwind
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          bash scripts/build-tailwind.sh
          changes="$(git status --porcelain -- app/static/css/)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            echo "::error::The committed Tailwind bundle is stale. Run 'bash scripts/build-tailwind.sh' and commit app/static/css/ (the CI-built bundle is attached as an artifact)."
            exit 1
          fi

      - name: Upload the CI-built Tailwind bundle
        if: failure() && steps.tailwind.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tailwind-bundle-ci-built
          path: |
            app/static/css/tailwind.*.css
            !app/static/css/tailwind.input.css
          retention-days: 7

      # i18n drift gate — re-extract the .pot from current sources and fail
      # if it differs from the committed file. Catches a developer who added
      # `_('...')` calls but forgot `python scripts/i18n.py extract` before
      # pushing. Translation work then stays in sync with code.
      - name: i18n message-catalog drift
        id: i18n
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python scripts/i18n.py drift-check

      # pip-audit scans dependencies for known CVEs.
      # Blocking — a failure means a published advisory affects a pinned dep.
      # If a finding is genuinely unfixable upstream, add the ID to the --ignore-vuln list
      # of every run of that lockfile below, here and in deps-latest.yml, with a comment
      # in this block naming the package + reason; never silence the whole step.
      #
      # Audits requirements.lock, not requirements.txt: the lockfile is what the
      # image installs (Dockerfile: pip install --require-hashes), so it is the
      # only file whose contents actually reach production. The lockfile-drift
      # job below guarantees it still corresponds to requirements.txt.
      #
      # The other three lockfiles hold tools CI runs: requirements-uv.lock the
      # uv that writes the lockfiles (lockfile-drift below, deps-lock.yml),
      # requirements-sbom.lock the SBOM generator (sbom.yml, release.yml,
      # docker.yml), and requirements-browser.lock Playwright and pytest for
      # the browser tests (browser.yml). The first two were not audited
      # until 2026-10, and uv 0.12.23 sat on
      # main unnoticed although its bundled CA store trusted a root whose
      # intermediate keys were compromised (GHSA-hq85-5cpj-mr62).
      #
      # Each lockfile is audited twice, against PyPI's advisory feed
      # (pip-audit's default) and against OSV (-s osv): either can lack an
      # advisory the other lists, as PyPI's feed lacked PYSEC-2026-4243 for
      # mako 1.4.1. --disable-pip audits the pins as written instead of
      # resolving them with pip, which leaves out packages its scratch venv
      # already holds; every entry is an exact, hashed pin
      # (tests/test_supply_chain_hygiene.py), so none is left out. --strict
      # fails on a package the source cannot look up instead of skipping it.
      # deps-latest.yml runs the same audits weekly.
      #
      # Ignored advisories: none at the moment.
      #
      # One step per lockfile and source, so the run's page names the one that
      # failed.
      - name: "Dependency vulnerability scan: requirements.lock (PyPI)"
        id: audit-lock-pypi
        run: pip-audit -r requirements.lock --disable-pip --strict

      - name: "Dependency vulnerability scan: requirements.lock (OSV)"
        id: audit-lock-osv
        run: pip-audit -r requirements.lock --disable-pip --strict -s osv

      - name: "Dependency vulnerability scan: requirements-uv.lock (PyPI)"
        id: audit-uv-pypi
        run: pip-audit -r requirements-uv.lock --disable-pip --strict

      - name: "Dependency vulnerability scan: requirements-uv.lock (OSV)"
        id: audit-uv-osv
        run: pip-audit -r requirements-uv.lock --disable-pip --strict -s osv

      - name: "Dependency vulnerability scan: requirements-sbom.lock (PyPI)"
        id: audit-sbom-pypi
        run: pip-audit -r requirements-sbom.lock --disable-pip --strict

      - name: "Dependency vulnerability scan: requirements-sbom.lock (OSV)"
        id: audit-sbom-osv
        run: pip-audit -r requirements-sbom.lock --disable-pip --strict -s osv

      - name: "Dependency vulnerability scan: requirements-browser.lock (PyPI)"
        id: audit-browser-pypi
        run: pip-audit -r requirements-browser.lock --disable-pip --strict

      - name: "Dependency vulnerability scan: requirements-browser.lock (OSV)"
        id: audit-browser-osv
        run: pip-audit -r requirements-browser.lock --disable-pip --strict -s osv

      # The vendored browser code in app/static/vendor/ (listed in its
      # manifest.json, plus the libraries a file's "bundles" field names) is
      # invisible to pip-audit and Dependabot. Same rule as pip-audit:
      # blocking; an advisory passes only when ACCEPTED in the script names it
      # for that version with a reason and a review date, and it fails again
      # once that date has passed. deps-latest.yml re-runs it weekly.
      - name: Vendored browser code vulnerability scan (OSV)
        id: vendor-osv
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python scripts/check_vendor_advisories.py

      # The WeasyPrint tests, the SSRF guard's included, skip where WeasyPrint
      # cannot render (no Pango, e.g. on Windows), and pytest still passes.
      # This runner installs Pango above, so they have to run here: fail now
      # if WeasyPrint cannot render, instead of letting them skip unnoticed.
      - name: WeasyPrint renders (its tests must not skip)
        id: weasyprint
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python -c "import weasyprint; assert weasyprint.HTML(string='<p>probe</p>').write_pdf().startswith(b'%PDF')"

      # docs/self-hosting.md ("Without the database superuser") runs the app,
      # and with it every migration, as a role that owns FileMorph's tables
      # but is no superuser. The Postgres tests log in as such a role too, so
      # a migration that needs a superuser (CREATE EXTENSION, CREATE SCHEMA,
      # an event trigger, ALTER SYSTEM) fails here instead of when an
      # installation starts.
      - name: A database role without superuser rights
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: >-
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d filemorph_test -v ON_ERROR_STOP=1
          -c "CREATE ROLE filemorph_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS"
          -c "GRANT USAGE, CREATE ON SCHEMA public TO filemorph_app"

      # -n logical runs the suite on one worker per vCPU (pytest-xdist; `auto`
      # would count physical cores once psutil is installed). --dist loadfile
      # keeps each test file on one worker, so the Postgres tests, which share
      # one database, run one after another (tests/test_audit_postgres.py);
      # (With pytest 9.2, xdist 3.8's xdist_group mark has no effect: xdist
      # rewrites Node._nodeid, which pytest 9.2 no longer reads.)
      # -ra lists every skipped and failed test
      # with its reason, --durations the slowest. The log feeds the summary at
      # the end.
      - name: Run tests
        id: tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          FILEMORPH_TEST_POSTGRES_URL: postgresql+asyncpg://filemorph_app@localhost:5432/filemorph_test
        run: |
          set -o pipefail
          pytest tests/ -n logical --dist loadfile -ra --durations=15 --tb=short | tee "$RUNNER_TEMP/tests.log"

      # PDF/A-2b conformance gate (NEU-C.1.c), in three steps. This one has
      # PdfToPdfaConverter convert a worst-case source (unembedded standard-14
      # Helvetica) into build/verapdf-fixture.pdf; the next validates it with
      # the veraPDF CLI in its own container; the last keeps the fixture.
      #
      # They are steps of lint-and-test, the required check, so a conformance
      # regression blocks the merge. verapdf.yml, where they used to run, was
      # reported on every PR and required by nothing, and installed the
      # environment this job already has: the fixture is built with the
      # lockfile's versions installed above (pikepdf above all, as in the
      # image) and the Ghostscript from the apt step. Without Ghostscript the
      # fixture would come out markup-only and veraPDF would correctly reject
      # it for "fonts not embedded", i.e. this gate would mask a broken gs path.
      - name: Generate PDF/A fixture via PdfToPdfaConverter
        id: pdfa-fixture
        run: python scripts/verapdf_check.py

      # The veraPDF maintainers publish a thin Docker image that wraps
      # the official CLI. --flavour 2b validates against PDF/A-2b;
      # --format mrr emits a machine-readable XML report to stdout for
      # CI log grep. The CLI exits non-zero on any conformance error,
      # which fails the step and the job.
      #
      # Pinned by digest: `latest` moves with every veraPDF release, so the
      # validator could change between two runs of the same commit. Dependabot
      # does not track images in workflow scripts — to move the pin, take the
      # new digest from `docker buildx imagetools inspect verapdf/cli:<tag>`.
      - name: Validate PDF/A-2b conformance with veraPDF
        id: verapdf
        env:
          # verapdf/cli:v1.30.2 (what `latest` pointed at on 2026-09-26)
          VERAPDF_IMAGE: verapdf/cli@sha256:d5ee329657cf9bc4b2400392dd54c7d0a0ce9980ff6fa2da5590eebeec007cdb
        run: |
          docker run --rm --network none -v "$PWD/build:/data:ro" "$VERAPDF_IMAGE" \
            --flavour 2b --format mrr /data/verapdf-fixture.pdf

      # Keep the fixture as a workflow artifact, so a maintainer debugging a red
      # run can download it and validate it locally; the validator's report is
      # in the log of the step above. Runs after a failure too, and says
      # nothing when there is no fixture: if an earlier step failed it was
      # never built, and that failure is what the run reports.
      - name: Upload fixture as artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verapdf-fixture
          path: build/verapdf-fixture.pdf
          if-no-files-found: ignore
          retention-days: 7

      # The run's page shows every check above with its result, the test counts
      # and the slowest tests, without opening the log.
      - name: Summary
        if: ${{ !cancelled() }}
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          {
            echo "### lint-and-test"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            jq -r 'to_entries[] | "| \(.key) | \({"success": "✅ passed", "failure": "❌ failed", "skipped": "⏭️ skipped", "cancelled": "⚪ cancelled"}[.value.outcome] // .value.outcome) |"' <<< "$STEPS"
            log="$RUNNER_TEMP/tests.log"
            if [ -f "$log" ]; then
              echo
              echo "**Tests:** $(grep -E '^=+ .* in [0-9.]+s' "$log" | tail -n 1 | sed -E 's/^=+ | =+$//g')"
              echo
              echo "<details><summary>Slowest tests</summary>"
              echo
              echo '```'
              awk '/slowest 15 durations/ {f = 1; next} f && /^=/ {exit} f' "$log"
              echo '```'
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # requirements.lock is what the image installs, so it has to keep
  # corresponding to requirements.txt. Before this gate existed it did not:
  # Dependabot pushed 32 commits to requirements.txt in six months while the
  # lockfile got 4 (one of them only line endings), leaving it short of four
  # packages entirely and behind on five more. Recompiling here and diffing is
  # the only way to notice.
  #
  # On drift this fails and uploads the correct lockfile as an artifact — grab
  # it and commit it, or run the deps-lock workflow to have it committed for
  # you. The lockfile targets the shipped Python version (markers resolve per
  # version, so one resolved elsewhere can be uninstallable in the image);
  # `uv pip compile --python-version` resolves *for* that version without
  # needing it installed, which is why anyone can regenerate the lockfile from
  # any machine.
  #
  # requirements-sbom.lock, the SBOM generator's lockfile, is checked the same
  # way against requirements-sbom.txt. Dependabot only edits that .txt, so
  # without this a generator bump would merge green and change nothing. So
  # is requirements-browser.lock against requirements-browser.txt, compiled
  # with requirements.lock as constraints: a change there to a package both
  # hold turns this red until the browser lockfile follows.
  lockfile-drift:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Any interpreter would do here — uv resolves for the target version
          # via --python-version. Kept at the shipped version so every workflow
          # agrees, which the gate in lint-and-test enforces.
          python-version: "3.14"
          cache: "pip"

      # The exact uv requirements-dev.txt pins: a resolver update can
      # legitimately produce a different lockfile, which would turn this gate
      # red with no dependency change behind it, so this job, deps-lock.yml and
      # a local recompile must run the same release. It is installed as a
      # wheel from requirements-uv.lock, which lists that release's files by
      # hash: pip refuses a file added to the release later, such as a wheel
      # it would prefer, instead of running it here or in deps-lock, whose
      # lockfiles get committed. The version is still set in
      # requirements-dev.txt alone (typed in here, it was left behind twice,
      # because Dependabot bumps only that file), and
      # tests/test_supply_chain_hygiene.py fails until requirements-uv.lock
      # follows a bump.
      - name: Install uv
        run: |
          pip install --require-hashes --only-binary :all: -r requirements-uv.lock

      # The command must match the one recorded in the committed lockfile's
      # header verbatim, since uv writes that command into the file. uv also
      # reads the existing output file as a preference, so unchanged
      # dependencies keep their pins and a new upstream release does not turn
      # this gate red on its own.
      #
      # --python-platform matters as much as --python-version: uvicorn[standard]
      # pulls uvloop on Linux and not on Windows, so a lockfile resolved on a
      # developer's Windows box is missing a package the image needs. Pinning
      # the platform makes the result identical wherever it is generated. This
      # gate caught exactly that on its first run.
      - name: Recompile the lockfiles
        run: |
          cp requirements.lock requirements.lock.committed
          uv pip compile --generate-hashes --python-version 3.14 --python-platform x86_64-unknown-linux-gnu --output-file requirements.lock requirements.txt
          cp requirements-sbom.lock requirements-sbom.lock.committed
          uv pip compile --generate-hashes --python-version 3.14 --python-platform x86_64-unknown-linux-gnu --output-file requirements-sbom.lock requirements-sbom.txt
          cp requirements-browser.lock requirements-browser.lock.committed
          uv pip compile --generate-hashes --python-version 3.14 --python-platform x86_64-unknown-linux-gnu --constraint requirements.lock --output-file requirements-browser.lock requirements-browser.txt

      - name: Compare
        id: compare
        run: |
          drifted=""
          diff -u requirements.lock.committed requirements.lock || drifted="$drifted requirements.lock"
          diff -u requirements-sbom.lock.committed requirements-sbom.lock || drifted="$drifted requirements-sbom.lock"
          diff -u requirements-browser.lock.committed requirements-browser.lock || drifted="$drifted requirements-browser.lock"
          if [ -z "$drifted" ]; then
            echo "requirements.lock, requirements-sbom.lock and requirements-browser.lock are in sync with their .txt files"
          else
            echo "::error::Out of sync with its .txt file:$drifted. Download the 'requirements-lock-recompiled' artifact and commit the file(s) named here, or run the deps-lock workflow."
            exit 1
          fi

      - name: Upload the recompiled lockfiles
        if: failure() && steps.compare.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: requirements-lock-recompiled
          path: |
            requirements.lock
            requirements-sbom.lock
            requirements-browser.lock
          retention-days: 7

  secret-scan:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (server-side secret scanner)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
