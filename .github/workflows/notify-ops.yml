name: Notify Ops Repo

on:
  workflow_run:
    workflows: ["Docker"]
    types: [completed]
    branches: [main]

# This job only fires a cross-repo dispatch with a separate PAT secret; it
# never touches the built-in GITHUB_TOKEN, so it needs no permissions at all.
permissions: {}

jobs:
  notify:
    # Deploys only after a successful Docker run that a push or a manual
    # dispatch started in this repository, never after a run for a pull
    # request. tests/test_workflow_triggers.py pins this condition.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' ||
      github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ops-repo deploy
        env:
          PAT: ${{ secrets.OPS_REPO_DISPATCH_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::OPS_REPO_DISPATCH_PAT secret is empty or unset"
            exit 1
          fi
          status=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/MrChengLen/filemorph-ops/dispatches \
            -d '{"event_type":"filemorph-published"}')
          echo "HTTP $status"
          cat /tmp/resp.json
          if [ "$status" != "204" ]; then
            echo "::error::dispatch failed (expected 204)"
            exit 1
          fi
