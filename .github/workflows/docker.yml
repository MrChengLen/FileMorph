name: Docker

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  # Manual rebuild: dispatched on main, runs the whole chain (build, push,
  # sign, attest the SBOM, `notify-ops`, deploy) without a code change, e.g.
  # to redeploy during an incident. The deploy at the end is started only if
  # the CI run of that commit has succeeded too and the commit is still main's
  # newest.
  workflow_dispatch:

# Builds of one ref run one at a time, so the image tags move in merge order.
# Before, two merges less than a minute apart built side by side, and the older
# build could finish last and take `:latest` and `:office` over (2026-09-26 and
# 2026-09-28, among other days). GitHub keeps one pending run per group and
# cancels the pending one when a newer run queues: of several merges in a row
# the build in progress finishes, the newest commit builds next, and the
# commits in between are not built. A running build is never cancelled.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      # Build slim + office in parallel; fail-fast off because the two
      # variants are independent — a Pango regression in slim shouldn't
      # mask an upstream LibreOffice break in office (or vice versa).
      fail-fast: false
      matrix:
        include:
          - target: base
            suffix: ""
            description: "Slim image (mammoth+WeasyPrint docx→pdf path)"
          - target: office
            suffix: "-office"
            description: "Office image (adds LibreOffice for high-fidelity docx→pdf)"
    # Each variant's exact digest, for `attest-sbom`. The legs of a matrix
    # share one set of job outputs, so every variant writes a name of its
    # own (a name both legs set would keep whichever leg finished last) and
    # leaves the other empty: the runner does not write an empty output, so
    # it cannot overwrite the other leg's digest.
    outputs:
      digest-base: ${{ matrix.target == 'base' && steps.build.outputs.digest || '' }}
      digest-office: ${{ matrix.target == 'office' && steps.build.outputs.digest || '' }}
    permissions:
      contents: read
      packages: write
      # NEU-B.4: cosign keyless signing uses the GitHub Actions OIDC
      # token to prove identity to Sigstore's Fulcio CA — no long-lived
      # signing key to manage or rotate. Verifiable later with
      #   cosign verify ghcr.io/<owner>/<repo>@sha256:<digest> \
      #     --certificate-identity-regexp "^https://github\\.com/<owner>/<repo>/" \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Buildx's `docker-container` driver: the image goes out as an OCI index
      # that carries a SLSA provenance attestation, which the `docker` driver
      # cannot produce on the runner's classic image store.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Defaults to true: a buildx it downloads (given a `version:`, or on
          # a runner image without one) would go through the Actions cache,
          # which this job must not restore — see the build step.
          cache-binary: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The office variant gets the same tag set as slim but with a
          # ``-office`` suffix so a consumer can pick either by tag —
          # filemorph:1.1.0 vs filemorph:1.1.0-office. The slim image
          # keeps ``:latest`` (default for naive pulls); the office image
          # gets ``:office`` for the matching shorthand.
          tags: |
            type=semver,pattern={{version}},suffix=${{ matrix.suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ matrix.suffix }}
            type=raw,value=${{ matrix.target == 'base' && 'latest' || 'office' }}
            type=sha,format=short,prefix=sha-,suffix=${{ matrix.suffix }}
          # ``:latest`` comes from the raw entry above, and only from it. By
          # default (``latest=auto``) the action also adds a ``latest`` tag
          # to both variants on a release tag, without the ``-office``
          # suffix, so whichever image finished last would keep ``:latest`` —
          # usually the office image, the slower build.
          flavor: latest=false

      - name: Build and push Docker image (${{ matrix.target }})
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No build cache, on tags or on main. Every job on main can write
          # the repository's Actions cache whatever its `permissions:` say
          # (the cache token can be read from the runner process), and jobs
          # there install PyPI releases that no lockfile pins — ci.yml's
          # lint-and-test, deps-latest.yml. BuildKit takes a cached layer
          # without re-running its step, so a planted entry could supply the
          # `pip install --require-hashes` layer with no hash ever checked, and
          # the image would still be signed below. Tag builds can restore
          # main's entries; main's own builds read them directly and deploy via
          # notify-ops. Building without it takes about half a minute longer
          # per image, and every build installs current Debian packages rather
          # than reusing an old layer.
          no-cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.4.1"

      - name: Sign published image (keyless / Sigstore)
        env:
          COSIGN_EXPERIMENTAL: "true"
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        # Sign every tag that got pushed at the SAME digest so a downstream
        # `cosign verify ghcr.io/.../filemorph:<tag>` works regardless of
        # which alias the consumer pulls.
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            cosign sign --yes "${tag}@${DIGEST}"
          done

  # The SBOM that `attest-sbom` binds to the images, generated in a job that
  # can only read: installing the image's dependency set and the generator
  # runs over a hundred third-party packages, and none of that code runs next
  # to the tokens that push, sign and attest. The three SBOM steps are
  # sbom.yml's, verbatim — tests/test_supply_chain_hygiene.py fails if they
  # differ — so dispatching sbom.yml on a branch tries them; this workflow
  # pushes images and cannot be tried that way.
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Must match the Dockerfile's base image — the app is only ever
          # tested on the version it ships on. scripts/check_python_version.py
          # gates this; see its docstring for the drift it exists to prevent.
          python-version: "3.14"
          # No `cache: "pip"`: code running on main can write it, and
          # --require-hashes does not cover every cached file (see sbom.yml).

      - name: Install the image's dependency set
        run: |
          python -m venv "$RUNNER_TEMP/image-env"
          "$RUNNER_TEMP/image-env/bin/pip" install --require-hashes -r requirements.lock

      - name: Install CycloneDX generator
        run: |
          pip install --require-hashes --only-binary :all: -r requirements-sbom.lock

      - name: Generate CycloneDX SBOM (JSON)
        env:
          VERSION: ${{ github.sha }}
        run: |
          cyclonedx-py environment "$RUNNER_TEMP/image-env/bin/python" \
            --PEP-639 \
            --output-file "filemorph-${VERSION}.cdx.json" \
            --output-format JSON

      - name: Hand the SBOM to the attestation job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: filemorph-${{ github.sha }}.cdx.json
          if-no-files-found: error
          # A week, so that a failed attestation can be re-run ("Re-run failed
          # jobs") after a weekend without building the images again.
          retention-days: 7

  # Binds the SBOM to each image's digest as a signed attestation: signed
  # keyless through Sigstore like the cosign signature, stored with the
  # repository's attestations and pushed to GHCR next to the image. Every
  # build gets one — tags, main and manual rebuilds — so `:latest` and
  # `:office` carry one too. docs/release-signing.md shows how to verify it.
  #
  # What the SBOM covers: the Python packages the image installs from
  # requirements.lock, at the locked versions, plus the pip of the venv it
  # is generated from, whose version can differ from the image's. It is
  # generated from the lockfile, not by scanning the image, so the Python
  # interpreter and the Debian packages of the base image and of the apt
  # layers (ffmpeg, Ghostscript, the Cairo/Pango stack, LibreOffice in the
  # office image) are not in it.
  #
  # This job can sign and push, so it checks nothing out and installs
  # nothing: it downloads the SBOM, logs in with the docker CLI and runs
  # GitHub's attest action.
  attest-sbom:
    needs: [build-and-push, sbom]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [base, office]
    permissions:
      attestations: write  # store the attestation with the repository
      id-token: write      # OIDC token for the Sigstore signing certificate
      packages: write      # push the attestation to GHCR
    steps:
      # Into a directory of its own: the artifact comes from a job that ran
      # third-party code.
      - name: Download the SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom

      # The docker CLI rather than docker/login-action, so that only GitHub's
      # own actions run next to this job's tokens. The attest action reads
      # the login from the docker config file this writes.
      - name: Log in to GitHub Container Registry
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login "$REGISTRY" --username "$ACTOR" --password-stdin

      - name: Attest the SBOM to the ${{ matrix.target }} image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          # No tag: the digest identifies the image. The action lowercases
          # the name, as registry paths must be.
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.build-and-push.outputs[format('digest-{0}', matrix.target)] }}
          sbom-path: sbom/filemorph-${{ github.sha }}.cdx.json
          push-to-registry: true
          # Storage records exist for organisation-owned repositories only,
          # and would need `artifact-metadata: write`.
          create-storage-record: false
