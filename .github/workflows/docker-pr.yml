name: Docker PR build

# Builds both published images on every pull request to main, without pushing
# them, and smoke-tests each one: the container starts and answers
# /api/v1/health, the first start generates an API key, the programs and
# libraries the converters call are there, and the image holds what the app
# needs and none of the build folder's secrets. docker.yml builds only after
# merge, and notify-ops.yml starts the deploy of a successful main build once
# CI has passed on it too, so a broken Dockerfile, .dockerignore,
# entrypoint.sh or requirements.lock used to show up first on its way to
# production.
#
# A workflow of its own rather than a pull_request trigger in docker.yml,
# whose job holds the token that pushes to GHCR and the identity that signs.
# Here the token is read-only and no secret is used, so nothing can be pushed
# or signed, and notify-ops.yml deploys only after push and manual runs in
# this repository. tests/test_supply_chain_hygiene.py and
# tests/test_workflow_triggers.py pin both.
#
# Every pull request, not only those touching the Docker files: an app change
# can break the image alone (a file it reads that .dockerignore leaves out, a
# library it loads that the image lacks), and a workflow a `paths:` filter
# skips never reports, so it could not become a required check.

on:
  pull_request:
    branches: ["main"]

# Pull requests only, so a newer push always supersedes the running check.
concurrency:
  group: docker-pr-${{ github.ref }}
  cancel-in-progress: true

# Read-only: without `packages: write` nothing can be pushed to GHCR, and
# without `id-token: write` nothing can be signed.
permissions:
  contents: read

jobs:
  smoke-test:
    name: smoke-test (${{ matrix.target }})
    runs-on: ubuntu-latest
    # A cold office build takes about four minutes; a hung step should not
    # hold a runner for the default six hours.
    timeout-minutes: 20
    strategy:
      # The variants are independent, as in docker.yml: a failure in one
      # should not cancel the other.
      fail-fast: false
      matrix:
        target: [base, office]
    env:
      # A local name: no registry, never pushed.
      IMAGE: filemorph:pr-${{ matrix.target }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build runs the pull request's Dockerfile; no token on disk.
          persist-credentials: false

      # .env and data/api_keys.json are what a self-hoster's build folder may
      # hold and `COPY . .` must not take into the image; .dockerignore keeps
      # them out, and a clean checkout has neither. context-canary is the
      # control: nothing ignores it, so the image holds it only if the build
      # used this folder.
      - name: Plant canaries in the build context
        run: |
          printf 'FILEMORPH_CANARY=must-not-reach-the-image\n' > .env
          printf '{"keys": ["must-not-reach-the-image"]}\n' > data/api_keys.json
          printf 'must reach the image\n' > context-canary

      # The builder docker.yml uses (buildx with the docker-container driver),
      # so a Dockerfile accepted here is accepted after merge too.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # As in docker.yml: a buildx it downloaded would otherwise come from
          # the Actions cache, which nothing trustworthy writes.
          cache-binary: false

      # `context: .` builds the checkout, canaries included; without it the
      # action would build the Git ref. No layer cache: docker.yml no longer
      # writes one, so whatever the Actions cache held would be stale or
      # planted by a job on main, and the smoke test would pass on layers this
      # pull request never built.
      - name: Build the ${{ matrix.target }} image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: ${{ env.IMAGE }}

      # The image as built, not a running container: the first start writes
      # data/api_keys.json itself. appuser, whom the container runs as, can
      # change nothing of the app's code or its Python packages; of the app's
      # files, only /app/data is writable for it.
      - name: Check what the image holds
        run: |
          docker run --rm --entrypoint sh "$IMAGE" -c '
            status=0
            for path in /app/.env /app/data/api_keys.json /app/.git /app/.github /app/tests; do
              if [ -e "$path" ]; then echo "::error::$path is in the image"; status=1; fi
            done
            for path in /app/context-canary /app/scripts/first_run.py /app/locale/de/LC_MESSAGES/messages.po /app/locale/en/LC_MESSAGES/messages.po /app/alembic.ini; do
              if [ ! -e "$path" ]; then echo "::error::$path is missing from the image"; status=1; fi
            done
            changeable="$(find /app /opt/venv -path /app/data -prune -o \( -writable -o -user appuser \) -print | head -n 3 | tr "\n" " ")"
            if [ -n "$changeable" ]; then echo "::error::appuser can change $changeable"; status=1; fi
            # The same test on /app/data: a find that fails cannot pass the one above.
            if [ "$(find /app/data -maxdepth 0 \( -writable -o -user appuser \) -print)" != /app/data ]; then
              echo "::error::appuser cannot write to /app/data"; status=1
            fi
            exit $status
          '

      # Started the way docker-compose.yml runs it (all capabilities dropped,
      # no privilege escalation, its process limit, no core dumps) and asked
      # through the published port, where a self-hoster reaches it.
      - name: Start the container and wait for /api/v1/health
        run: |
          docker run --detach --name filemorph --publish 8000:8000 \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 4096 --ulimit core=0 "$IMAGE"
          for _ in $(seq 30); do
            if curl -fsS --max-time 5 http://localhost:8000/api/v1/health; then
              echo
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' filemorph)" != true ]; then
              docker logs filemorph
              echo "::error::The container exited while starting"
              exit 1
            fi
            sleep 2
          done
          docker logs filemorph
          echo "::error::/api/v1/health did not answer after 30 attempts, 2 seconds apart"
          exit 1

      - name: Check the first start
        run: |
          status=0
          logs="$(docker logs filemorph 2>&1)"
          # entrypoint.sh prints the key it generates. With a key file in the
          # image it would find that one and print none.
          if ! grep -Eq 'API KEY: [A-Za-z0-9_-]{32,}$' <<< "$logs"; then
            echo "::error::The logs show no first-run API key"
            status=1
          fi
          # docker-compose.yml's healthcheck runs curl inside the container.
          if ! docker exec filemorph curl -fsS --max-time 5 -o /dev/null http://localhost:8000/api/v1/health; then
            echo "::error::curl inside the container does not reach /api/v1/health"
            status=1
          fi
          uid="$(docker exec filemorph id -u)" || uid=
          if [ "$uid" = 0 ]; then
            echo "::error::The container runs as root"
            status=1
          fi
          # The app compiles locale/*/LC_MESSAGES/messages.po at start-up;
          # without the catalogue every German page falls back to English.
          # tests/test_convert_pair_pages.py::test_footer_links_localized pins
          # the same footer string, so a rewording updates both.
          if ! curl -fsS --max-time 5 http://localhost:8000/de/ | grep -q 'Beliebte Konvertierungen'; then
            echo "::error::/de/ shows no German footer: the translation catalogue did not load"
            status=1
          fi
          # Fresh logs: they include whatever the checks above made the app log.
          if [ "$status" != 0 ]; then docker logs filemorph 2>&1; fi
          exit "$status"

      # Start-up does not prove these: the app only logs a warning when ffmpeg
      # is missing, calls Ghostscript as a program, and loads WeasyPrint (Pango,
      # HarfBuzz, fontconfig) only for a conversion that needs it. The probe
      # page references nothing, so WeasyPrint has nothing to fetch.
      - name: Check the converters' programs and libraries
        run: |
          docker exec filemorph ffmpeg -version > /dev/null
          # Video -> GIF (app/converters/video.py): the ffprobe check, both
          # ffmpeg passes and the frame count with the image's ffmpeg (newer
          # than the CI runner's); then a GIF over a tiny output cap.
          docker exec -i filemorph python - <<'PY'
          import pathlib, subprocess, tempfile
          from app.converters.base import OutputTooLargeError
          from app.converters.video import VideoToGifConverter
          d = pathlib.Path(tempfile.mkdtemp())
          clip = ["ffmpeg", "-v", "error", "-f", "lavfi", "-i", "testsrc2=duration=1:size=640x360:rate=25"]
          subprocess.run([*clip, "-pix_fmt", "yuv420p", str(d / "in.mp4")], check=True)
          VideoToGifConverter().convert(d / "in.mp4", d / "out.gif", max_output_bytes=10**7)
          assert (d / "out.gif").read_bytes()[:6] == b"GIF89a"
          try:
              VideoToGifConverter().convert(d / "in.mp4", d / "cap.gif", max_output_bytes=1000)
          except OutputTooLargeError:
              print("ok: GIF made, a GIF over the cap refused")
          else:
              raise SystemExit("a GIF over the cap was not refused")
          PY
          # Audio (app/converters/audio.py): the music tags are read and
          # written back with the image's ffmpeg — from an MP3's container,
          # then from an Ogg file's audio stream — and no other tag is kept.
          docker exec -i filemorph python - <<'PY'
          import json, pathlib, subprocess, tempfile
          import app.converters.audio  # registers the audio pairs
          from app.converters.registry import get_converter
          d = pathlib.Path(tempfile.mkdtemp())
          tags = ["-metadata", "title=Song", "-metadata", "date=2026-06-15", "-metadata", "location=+53.5+009.9/"]
          subprocess.run(["ffmpeg", "-v", "error", "-f", "lavfi", "-i", "sine=duration=0.5", *tags, str(d / "in.mp3")], check=True)
          get_converter("mp3", "ogg").convert(d / "in.mp3", d / "mid.ogg", quality=85)
          get_converter("ogg", "mp3").convert(d / "mid.ogg", d / "out.mp3", quality=85)
          probe = ["ffprobe", "-v", "error", "-of", "json", "-show_entries", "format_tags", str(d / "out.mp3")]
          kept = json.loads(subprocess.run(probe, capture_output=True, check=True).stdout)["format"]["tags"]
          assert kept.get("title") == "Song" and kept.get("date") == "2026" and "location" not in kept, kept
          print("ok: music tags kept, the location dropped")
          PY
          docker exec filemorph gs --version
          docker exec filemorph python -c "import weasyprint; assert weasyprint.HTML(string='<p>probe</p>').write_pdf().startswith(b'%PDF')"
          # PDF -> TXT runs pypdf in a child process (app/converters/_pdf_text.py):
          # start it the way the converter does, inside the image.
          docker exec filemorph python -c "import pathlib, tempfile; from pypdf import PdfWriter; from app.converters.document import PdfToTxtConverter; d = pathlib.Path(tempfile.mkdtemp()); w = PdfWriter(); w.add_blank_page(width=200, height=200); w.write(d / 'in.pdf'); PdfToTxtConverter().convert(d / 'in.pdf', d / 'out.txt'); assert (d / 'out.txt').exists()"
          # The table conversions and PDF compression run in a child process too
          # (app/converters/_isolated.py): one of each, started the way the routes do.
          docker exec filemorph python -c "import json, pathlib, tempfile; from app.converters.spreadsheet import CsvToJsonConverter; d = pathlib.Path(tempfile.mkdtemp()); (d / 'in.csv').write_text('a,b\n1,2\n'); CsvToJsonConverter().run(d / 'in.csv', d / 'out.json'); assert json.loads((d / 'out.json').read_text()) == [{'a': '1', 'b': '2'}]"
          docker exec filemorph python -c "import pathlib, tempfile; from pypdf import PdfWriter; from app.converters._isolated import run_isolated; d = pathlib.Path(tempfile.mkdtemp()); w = PdfWriter(); w.add_blank_page(width=200, height=200); w.write(d / 'in.pdf'); r = run_isolated('pdf-compress', too_large='-', tmp_dir=d, input_path=d / 'in.pdf', output_path=d / 'out.pdf', target_bytes=100000); assert r['achieved_bytes'] > 0 and (d / 'out.pdf').read_bytes()[:4] == b'%PDF', r"
          # The limits these children set on themselves hold in the container
          # too, with all capabilities dropped: address space, CPU time, file
          # size (a write past it ends the process), no core dump and no
          # process or thread of their own, each as a hard limit the process
          # can't raise again; first in line for the OOM killer.
          docker exec filemorph python -c "import ctypes, resource, signal; from app.converters._isolated import limit_resources; limit_resources(2**30, 95, 2**30); assert [resource.getrlimit(r) for r in (resource.RLIMIT_AS, resource.RLIMIT_CPU, resource.RLIMIT_FSIZE, resource.RLIMIT_CORE, resource.RLIMIT_NPROC)] == [(2**30, 2**30), (95, 95), (2**30, 2**30), (0, 0), (0, 0)]; assert signal.getsignal(signal.SIGXFSZ) == signal.SIG_DFL; assert ctypes.CDLL(None).prctl(3, 0, 0, 0, 0) == 0; assert open('/proc/self/oom_score_adj').read().strip() == '1000'"
          # A write past the file size limit ends the process with SIGXFSZ,
          # which docker exec reports as status 128 + 25.
          status=0
          docker exec filemorph python -c "import pathlib, tempfile; from app.converters._isolated import limit_resources; limit_resources(2**30, 95, 2**20); pathlib.Path(tempfile.mkdtemp(), 'out').write_bytes(bytes(2**21))" || status=$?
          if [ "$status" != 153 ]; then
            echo "::error::A write past the file size limit ended with status $status, not 153 (SIGXFSZ)"
            exit 1
          fi

      # What else these children do to themselves (limit_resources in
      # app/converters/_isolated.py), checked where they run: a fork or a new
      # thread fails, they are set to get SIGKILL when their parent ends (that
      # it arrives, tests/test_isolated_conversions.py shows), and they set
      # no-new-privileges themselves, here in a container started without
      # docker-compose.yml's.
      - name: Check the conversion children's isolation
        run: |
          docker exec -i filemorph python - <<'PY'
          import ctypes, os, signal, threading
          from app.converters._isolated import limit_resources
          limit_resources(2**30, 95, 2**30)
          try:
              pid = os.fork()
          except BlockingIOError:
              pass
          else:
              if pid == 0:
                  os._exit(0)
              raise SystemExit("a child started a process")
          try:
              threading.Thread(target=int).start()
          except RuntimeError:
              pass
          else:
              raise SystemExit("a child started a thread")
          deathsig = ctypes.c_int()
          ctypes.CDLL(None).prctl(2, ctypes.byref(deathsig), 0, 0, 0)  # PR_GET_PDEATHSIG
          assert deathsig.value == signal.SIGKILL, deathsig.value
          print("ok: no process, no thread, SIGKILL when the parent ends")
          PY
          docker run --rm --entrypoint python "$IMAGE" -c "import ctypes; from app.converters._isolated import limit_resources; prctl = ctypes.CDLL(None).prctl; assert prctl(39, 0, 0, 0, 0) == 0, 'set before'; limit_resources(2**30, 95, 2**30); assert prctl(39, 0, 0, 0, 0) == 1; print('ok: no-new-privileges set by the child')"

      # The app process marks itself non-dumpable as it loads (app/main.py):
      # a process of appuser, as the conversion children are, reads the
      # environment of another process of appuser, but not the app's. PID 1
      # is the app, as entrypoint.sh hands over to uvicorn with exec. Then
      # the app at work: a conversion through it runs in a child it starts,
      # and its process metrics still read its own /proc files.
      - name: Check the app process's isolation
        run: |
          docker exec -i filemorph python - <<'PY'
          import os, pathlib, subprocess
          assert b"uvicorn" in pathlib.Path("/proc/1/cmdline").read_bytes(), "PID 1 is not uvicorn"
          status = pathlib.Path("/proc/1/status").read_text().splitlines()
          uids = next(line for line in status if line.startswith("Uid:")).split()[1:]
          assert uids == [str(os.getuid())] * 4, f"PID 1 runs as {uids}, not as this user"
          # Non-dumpable: the kernel hands the app's /proc files to root.
          assert os.stat("/proc/1/environ").st_uid == 0, "PID 1 is dumpable"
          other = subprocess.Popen(["sleep", "30"])
          try:
              pathlib.Path(f"/proc/{other.pid}/environ").read_bytes()
          finally:
              other.kill()
              other.wait()
          try:
              pathlib.Path("/proc/1/environ").read_bytes()
          except PermissionError:
              print("ok: the app process's environment is out of reach")
          else:
              raise SystemExit("a process of appuser read the app process's environment")
          PY
          printf 'a,b\n1,2\n' > "$RUNNER_TEMP/in.csv"
          if ! curl -fsS --max-time 60 -F "file=@$RUNNER_TEMP/in.csv" -F target_format=json \
              -o "$RUNNER_TEMP/out.json" http://localhost:8000/api/v1/convert; then
            docker logs filemorph
            echo "::error::A conversion through the app failed"
            exit 1
          fi
          python3 -c "import json, sys; assert json.load(open(sys.argv[1])) == [{'a': '1', 'b': '2'}]" "$RUNNER_TEMP/out.json"
          metrics="$(curl -fsS --max-time 10 http://localhost:8000/api/v1/metrics)"
          if ! grep -q '^process_open_fds ' <<< "$metrics"; then
            echo "::error::/api/v1/metrics reports no process_open_fds"
            exit 1
          fi

      # Outgoing TLS other than Stripe's (the app's mail through aiosmtplib,
      # anything on ssl.create_default_context()) trusts the system CA store:
      # Debian's ca-certificates from the base image. The emSign ECC Root CA -
      # G3 must not be in it (GHSA-6q48-6c7w-9gw2; Debian dropped it in
      # ca-certificates 20250419+deb13u1, DSA-6572-1). Every certificate file
      # on OpenSSL's default paths is loaded the way a TLS client loads it;
      # ISRG Root X1 proves the check saw the store at all.
      - name: Check the system CA store
        run: |
          docker exec -i filemorph python - <<'PY'
          import pathlib, ssl
          paths = ssl.get_default_verify_paths()
          files = [pathlib.Path(paths.cafile)] if paths.cafile else []
          if paths.capath:
              files += [p for p in pathlib.Path(paths.capath).iterdir() if p.is_file()]
          ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT)
          for path in files:
              try:
                  ctx.load_verify_locations(cafile=path)
              except ssl.SSLError:
                  pass  # not a certificate file
          names = {v for c in ctx.get_ca_certs() for rdn in c["subject"] for k, v in rdn if k == "commonName"}
          assert "ISRG Root X1" in names, f"no CA store found ({len(files)} files read)"
          assert "emSign ECC Root CA - G3" not in names, "the system CA store trusts emSign ECC Root CA - G3"
          print(f"ok: {len(ctx.get_ca_certs())} CA certificates, emSign ECC Root CA - G3 not among them")
          PY

      # Audio and video conversions start ffmpeg through
      # app/converters/_limited_exec.py, which sets the limits first. In the
      # image, with all capabilities dropped: every decoder media_input()
      # allows is there, the program keeps the limits, a 4K video converts
      # within them, and a larger one gets the message that names the next
      # step.
      - name: Check ffmpeg's limits
        run: |
          docker exec -i filemorph python - <<'PY'
          import pathlib, re, subprocess, sys, tempfile
          import app.converters.video  # registers the video conversions
          from app.converters import _ffmpeg
          from app.converters.base import InvalidInputError
          from app.converters.registry import get_converter

          listed = subprocess.run(["ffmpeg", "-hide_banner", "-decoders"], capture_output=True, encoding="utf-8", check=True).stdout
          missing = set(_ffmpeg.INPUT_DECODERS.split(",")) - set(re.findall(r"^ [VAS][A-Z.]{5} (\S+)", listed, re.M))
          assert not missing, sorted(missing)

          memory, cpu, file_bytes = _ffmpeg._MEMORY_LIMIT_BYTES, 100, 2**20
          limits = [str(memory), str(cpu), str(file_bytes)]
          report = subprocess.run([sys.executable, "-I", "-S", str(_ffmpeg._LIMITED_EXEC), *limits, "/bin/cat", "/proc/self/limits", "/proc/self/oom_score_adj"], capture_output=True, encoding="utf-8", check=True).stdout
          for name, value in (("Max address space", memory), ("Max cpu time", cpu), ("Max file size", file_bytes)):
              assert re.search(rf"^{name}\s+{value}\s+{value}\s", report, re.M), name
          assert report.split()[-1] == "1000"

          work = pathlib.Path(tempfile.mkdtemp())
          def clip(name, width, seconds):
              path = work / name
              subprocess.run(["ffmpeg", "-v", "error", "-f", "lavfi", "-i", f"testsrc2=size={width}x{_ffmpeg._MAX_HEIGHT}:rate=30:duration={seconds}", "-c:v", "libx264", "-preset", "ultrafast", "-pix_fmt", "yuv420p", str(path)], check=True)
              return path
          # More frames than x264 looks ahead (40): the most memory it takes at this size.
          get_converter("mp4", "mkv").convert(clip("4k.mp4", _ffmpeg._MAX_WIDTH, 1.6), work / "4k.mkv", quality=85)
          try:
              get_converter("mp4", "mkv").convert(clip("larger.mp4", _ffmpeg._MAX_WIDTH + 64, 0.2), work / "larger.mkv", quality=85)
          except InvalidInputError as exc:
              assert "larger than 4K" in str(exc), exc
          else:
              raise SystemExit("a video larger than 4K converted")
          print("ok: the listed decoders are there, the limits hold, 4K converts, a larger video is refused")
          PY

      # What the office image adds, driven the way the DOCX converter drives
      # it: headless, with a throwaway profile, through Writer to PDF.
      - name: Check that LibreOffice converts
        if: matrix.target == 'office'
        run: |
          docker exec filemorph sh -c '
            printf "FileMorph smoke test\n" > /tmp/smoke.txt &&
            timeout 120 soffice --headless --norestore --nofirststartwizard --nolockcheck \
              -env:UserInstallation=file:///tmp/lo-profile \
              --convert-to pdf:writer_pdf_Export --outdir /tmp /tmp/smoke.txt &&
            test -s /tmp/smoke.pdf
          '

      # The office image is the only one that ships both Ghostscript (base
      # stage, for PDF/A) and LibreOffice. The DOCX converter runs soffice with
      # a reduced environment (app/converters/document.py::_soffice_child_env):
      # a gs stub ahead of the real Ghostscript on PATH, app secrets dropped.
      # Verify in the real image that (a) the child env resolves gs to the stub,
      # not /usr/bin, and (b) forcing the LibreOffice engine on a DOCX with an
      # embedded image still produces a PDF — i.e. the hardened env does not
      # break soffice or its graphics path. The app process keeps the real gs
      # for PDF/A; the smoke step above already ran it.
      - name: Check DOCX→PDF runs with a hardened soffice environment
        if: matrix.target == 'office'
        run: |
          docker exec -i -e FILEMORPH_OFFICE_ENGINE=libreoffice filemorph python - <<'PY'
          import io, os, shutil, tempfile
          from pathlib import Path
          from docx import Document
          from app.converters.document import (
              DocxToPdfConverter, _write_ghostscript_denial_shims, _soffice_child_env,
          )
          assert shutil.which("gs"), "the office image should ship Ghostscript"
          shim = Path(tempfile.mkdtemp()) / ".nogs"
          _write_ghostscript_denial_shims(shim)
          resolved = shutil.which("gs", path=_soffice_child_env(shim)["PATH"])
          assert resolved and Path(resolved).parent == shim, resolved
          # A one-pixel PNG exercises LibreOffice's graphics path with the
          # hardened env; bytes are a fixed, dependency-free image.
          png = bytes.fromhex(
              "89504e470d0a1a0a0000000d49484452000000010000000108060000001f15c4890000"
              "000d49444154789c6360606060000000050001a5f645400000000049454e44ae426082"
          )
          work = Path(tempfile.mkdtemp())
          src, out = work / "in.docx", work / "out.pdf"
          doc = Document(); doc.add_paragraph("office hardening probe"); doc.add_picture(io.BytesIO(png))
          doc.save(src)
          conv = DocxToPdfConverter(); conv.convert(src, out)
          assert conv.engine_used == "libreoffice", conv.engine_used
          assert out.read_bytes()[:4] == b"%PDF", "no PDF produced"
          print("ok: gs stub shadows the real gs for soffice; engine=%s" % conv.engine_used)
          PY
