name: SBOM

# Generates a CycloneDX-JSON Software Bill of Materials for every push to
# `main`, uploaded as a 90-day workflow artifact for continuous SBOM tracking.
# The artifact is named `filemorph-{version}.cdx.json` to line up with the
# references in docs/patch-policy.md and the EVB-IT-March-2026 SBOM mandate.
#
# Release attachment lives in `release.yml`, NOT here: a release published by
# the built-in GITHUB_TOKEN does not fire the `release: published` event
# (GitHub suppresses it to avoid recursive runs), so a `release`-triggered
# attach step here would silently never run. `release.yml` therefore generates
# and attaches the SBOM in the same job that publishes the release.
# `workflow_dispatch` stays so a maintainer can regenerate the artifact on
# demand (e.g. to back-fill a release cut before this split landed).
#
# What it describes: a fresh venv installed exactly as the Dockerfile installs
# the image (`pip install --require-hashes -r requirements.lock`), with the
# generator installed outside it. It used to describe the runner's own Python
# after `pip install -r requirements.txt` plus the generator — so the `>=`
# ranges put versions into the SBOM that the image does not contain, and the
# generator added its own dependencies (and moved one the image ships).
#
# Why "environment" and not "requirements": `cyclonedx-py environment` reads
# the installed distributions, so the SBOM carries their licences and the
# dependency graph. `cyclonedx-py requirements requirements.lock` parses the
# lockfile, hashes and all, but emits neither.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  generate-sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # only uploads a workflow artifact; release attach moved to release.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Must match the Dockerfile's base image — the app is only ever
          # tested on the version it ships on. scripts/check_python_version.py
          # gates this; see its docstring for the drift it exists to prevent.
          python-version: "3.14"
          cache: "pip"

      # The Dockerfile's builder-stage install, into a venv of its own so nothing
      # else on the runner ends up in the SBOM.
      - name: Install the image's dependency set
        run: |
          python -m venv "$RUNNER_TEMP/image-env"
          "$RUNNER_TEMP/image-env/bin/pip" install --require-hashes -r requirements.lock

      - name: Install CycloneDX generator
        # Pinned to the 5.x line for reproducibility; bump deliberately when
        # CycloneDX schema spec advances. Goes into the runner's Python, not
        # the venv above, so the generator is not part of what it describes.
        run: pip install "cyclonedx-bom>=5,<6"

      - name: Determine version label
        id: version
        # main-push + workflow_dispatch only (release attach moved to
        # release.yml), so the label is always the commit short-SHA.
        run: echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Generate CycloneDX SBOM (JSON)
        run: |
          cyclonedx-py environment "$RUNNER_TEMP/image-env/bin/python" \
            --output-file "filemorph-${{ steps.version.outputs.version }}.cdx.json" \
            --output-format JSON

      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ steps.version.outputs.version }}
          path: filemorph-*.cdx.json
          retention-days: 90
