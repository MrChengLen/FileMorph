# SPDX-License-Identifier: AGPL-3.0-or-later
# Dependabot — automated dependency-update PRs (PR-S, supply-chain hygiene).
#
# Three ecosystems:
#  - pip:            requirements.txt, requirements-dev.txt and
#                    requirements-sbom.txt (the SBOM generator's) — every
#                    update in one PR per week; capped majors are ignored
#  - github-actions: every `uses:` in .github/workflows/* — keeps the
#                    SHA-pinned actions current (Dependabot tracks the
#                    `# vX.Y` comment to know which version a SHA maps to)
#  - docker:         the base image in ./Dockerfile — keeps the
#                    digest-pinned `python:3.14-slim@sha256:...` fresh
#
# Weekly cadence (Monday) keeps the PR volume low; pip-audit in ci.yml is
# the same-day blocking gate for known CVEs, so Dependabot is the
# "stay current" layer, not the "react to a 0-day" layer.
#
# Dependabot only edits requirements.txt — it has no concept of the
# pip-compile lockfile the image installs from. A pip PR that raises a floor
# past the locked version therefore turns ci.yml's `lockfile-drift` job red
# until requirements.lock is recompiled — and `lint-and-test` too, whose
# install is constrained to the lockfile. Either run the `deps-lock` workflow
# on the PR branch, or take the lockfile that `lockfile-drift` uploads as an
# artifact. Those red gates are deliberate — when keeping the lockfile current
# was invisible manual work, it fell four packages behind. The same goes for
# requirements-sbom.txt and requirements-sbom.lock.
#
# So does the uv pin in requirements-dev.txt: the lockfile jobs install that
# uv hash-checked, from requirements-uv.lock, which Dependabot does not edit
# either. A uv bump therefore fails `lint-and-test`
# (tests/test_supply_chain_hygiene.py) until requirements-uv.lock is
# regenerated with the command in requirements-dev.txt. That red is the price
# of the hash check, which refuses a file added to a uv release after its
# hashes were taken.
#
# A base-image bump also moves the Python version the app ships on. The
# `python-version consistency` gate in ci.yml fails until the workflows and
# the lockfile follow, so such a PR is never mergeable half-done (see
# scripts/check_python_version.py).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    # Every Python update goes into ONE PR per week. The group used to select
    # by update type (minor and patch), but Dependabot gives a requirements.txt
    # floor raise (`>=a` -> `>=b`) no update type, so each still arrived as a
    # PR of its own: #191-#195 in one week. Four of those turned lint-and-test
    # and lockfile-drift red until requirements.lock was recompiled (see
    # above), so they belong together: one PR, one lockfile pass.
    groups:
      python-all:
        patterns:
          - "*"
    # Caps that need a deliberate change, not the weekly batch. They go by
    # version range: the requirements carry no update type that an
    # `update-types` rule could match. A held-back major is not proposed at
    # all: as its own PR it could only sit red until the port, and the port
    # is what lifts both the cap in requirements.txt and the entry here.
    # - cyclonedx-bom stays on 5.x: 7.x drops the --PEP-639 flag the SBOM
    #   workflows pass, and nothing on a PR runs the generator.
    # - pikepdf stays below 11 (requirements.txt).
    # - WeasyPrint stays below 70 until the SSRF url_fetcher guard is ported.
    # - Stripe stays below 16 until the Checkout call is ported.
    ignore:
      - dependency-name: "cyclonedx-bom"
        versions: [">=6"]
      - dependency-name: "pikepdf"
        versions: [">=11"]
      - dependency-name: "weasyprint"
        versions: [">=70"]
      - dependency-name: "stripe"
        versions: [">=16"]
    # A release has to be a few days old before it is proposed, so one that is
    # pulled or found malicious right after publication never reaches the batch.
    cooldown:
      default-days: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-all:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker(deps)"
