# FileMorph — Cloud Edition overlay (Postgres + JWT + Stripe)
#
# Layers on top of docker-compose.yml. Adds the database the Cloud
# Edition needs (user accounts, JWT auth, Stripe billing, admin
# cockpit, audit-log, daily metrics) and switches the app into
# Cloud-Edition mode by setting DATABASE_URL.
#
# When DATABASE_URL is set, the entrypoint runs ``alembic upgrade
# head`` before uvicorn starts so the schema is in place on first
# boot.
#
# Usage:
#
#   # First-time setup
#   cp .env.example .env
#   # edit .env to set strong POSTGRES_PASSWORD and JWT_SECRET (≥ 32 chars)
#
#   docker compose -f docker-compose.yml -f docker-compose.cloud.yml up -d
#
#   # Stop:
#   docker compose -f docker-compose.yml -f docker-compose.cloud.yml down
#
# Stripe + SMTP envs (STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
# SMTP_HOST etc.) are read from the same .env. They are optional —
# the app boots without them but the billing and email flows won't
# work until set. See docs/self-hosting.md and .env.example.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: filemorph
      POSTGRES_USER: filemorph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    # The restrictions docker-compose.yml gives the filemorph service. The
    # postgres entrypoint starts as root: it repairs the owner of the data
    # directory, then switches to the postgres user, and the server runs
    # without any capability. Tried on a populated data directory, an empty
    # volume and copies with the wrong owner or mode: without DAC_OVERRIDE
    # root cannot look into the data directory (mode 0700), without SETUID
    # or SETGID it cannot switch users, and Postgres does not start; CHOWN
    # repairs files with the wrong owner, as a restored copy may have.
    # FOWNER is not needed, unless you set POSTGRES_INITDB_WALDIR. Not
    # DAC_READ_SEARCH instead of DAC_OVERRIDE: with it, Docker's seccomp
    # profile allows open_by_handle_at.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    # One process per connection: at most max_connections (100) plus the
    # server's own (9 when idle). Raise it with max_connections.
    pids_limit: 256
    # No core dumps: a crashing backend would write rows and password hashes
    # from its memory to disk.
    ulimits:
      core: 0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filemorph"]
      interval: 5s
      timeout: 5s
      retries: 10

  filemorph:
    environment:
      # By default the app logs in as the superuser POSTGRES_USER, which can
      # run programs in the postgres container (COPY ... FROM PROGRAM) and
      # read its files. With POSTGRES_APP_PASSWORD set it logs in as
      # filemorph_app instead, a role that owns FileMorph's tables but is no
      # superuser. One variable switches both name and password, so no
      # half-set state can pair the wrong ones. docs/self-hosting.md, section
      # "Without the database superuser", creates the role first.
      DATABASE_URL: postgresql+asyncpg://filemorph${POSTGRES_APP_PASSWORD:+_app}:${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD:-changeme}}@postgres/filemorph
      # env_file (docker-compose.yml) passes every line of .env into the
      # container, the superuser's password included. The app never reads it.
      POSTGRES_PASSWORD: ""
      # No fallback: any default here would be public, and every deployment
      # started without JWT_SECRET would sign its logins with it. The app
      # itself also refuses a published or shorter-than-32-character secret.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env to at least 32 random characters, see .env.example}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
